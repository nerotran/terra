version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: terra-db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-terra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-terra_dev}
      POSTGRES_DB: ${POSTGRES_DB:-terra}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - terra_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-terra} -d ${POSTGRES_DB:-terra}"]
      interval: 10s
      timeout: 5s
      retries: 5

  importer:
    image: python:3.12-slim
    container_name: terra-importer
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-terra}
      POSTGRES_USER: ${POSTGRES_USER:-terra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-terra_dev}
    volumes:
      - ./db/scripts:/scripts
      - ./data:/data
    working_dir: /scripts
    command: >
      bash -c "
        pip install --quiet psycopg2-binary &&
        python import_basemap.py &&
        python import_territories.py &&
        python import_nation_snapshots.py
      "
    profiles:
      - import

volumes:
  terra_data:
